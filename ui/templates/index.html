<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>大乐透冷热度仪表盘</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border-radius: 12px;
        }
        .header h1 {
            font-size: 32px;
            color: #fbbf24;
            margin-bottom: 8px;
        }
        .header .subtitle {
            color: #94a3b8;
            font-size: 14px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #334155;
        }
        .tab {
            padding: 12px 24px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 16px;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .tab:hover { color: #e2e8f0; }
        .tab.active {
            color: #fbbf24;
            border-bottom-color: #fbbf24;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .card h2 {
            font-size: 20px;
            color: #fbbf24;
            margin-bottom: 15px;
        }
        .chart {
            width: 100%;
            min-height: 400px;
        }
        .hot-cold-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .heat-section {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid;
        }
        .heat-section.hot { border-color: #dc2626; }
        .heat-section.warm { border-color: #fbbf24; }
        .heat-section.cold { border-color: #1e3a8a; }
        .heat-section h3 {
            font-size: 16px;
            margin-bottom: 10px;
        }
        .heat-section.hot h3 { color: #dc2626; }
        .heat-section.warm h3 { color: #fbbf24; }
        .heat-section.cold h3 { color: #60a5fa; }
        .number-pill {
            display: inline-block;
            padding: 4px 10px;
            margin: 3px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
        }
        .hot .number-pill { background: #dc2626; color: white; }
        .warm .number-pill { background: #fbbf24; color: #1e293b; }
        .cold .number-pill { background: #1e3a8a; color: white; }
        .stat-box {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #fbbf24;
        }
        .stat-label {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 5px;
        }
        button.refresh {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        button.refresh:hover { background: #b91c1c; }
        .footer {
            text-align: center;
            color: #64748b;
            padding: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 大乐透数字冷热度仪表盘</h1>
        <div class="subtitle">多算法融合 · 实时热度 · 历史回测</div>
    </div>

    <div class="stat-box" id="stats"></div>

    <div class="tabs">
        <button class="tab active" data-tab="overview">总览</button>
        <button class="tab" data-tab="front">前区 35 选 5</button>
        <button class="tab" data-tab="back">后区 12 选 2</button>
        <button class="tab" data-tab="cooccurrence">共现分析</button>
        <button class="tab" data-tab="trend">走势</button>
    </div>

    <div class="tab-content active" id="overview">
        <div class="grid">
            <div class="card">
                <h2>🔥 前区热度总览</h2>
                <div id="front-bar" class="chart"></div>
            </div>
            <div class="card">
                <h2>🔥 后区热度总览</h2>
                <div id="back-bar" class="chart"></div>
            </div>
        </div>
        <div class="card">
            <h2>冷热分区</h2>
            <div id="hot-cold-overview"></div>
        </div>
    </div>

    <div class="tab-content" id="front">
        <div class="card">
            <h2>前区详细热度</h2>
            <div id="front-detail" class="chart"></div>
        </div>
        <div class="card" style="margin-top: 20px;">
            <h2>前区冷热分区</h2>
            <div id="front-hotcold"></div>
        </div>
    </div>

    <div class="tab-content" id="back">
        <div class="card">
            <h2>后区详细热度</h2>
            <div id="back-detail" class="chart"></div>
        </div>
        <div class="card" style="margin-top: 20px;">
            <h2>后区冷热分区</h2>
            <div id="back-hotcold"></div>
        </div>
    </div>

    <div class="tab-content" id="cooccurrence">
        <div class="card">
            <h2>号码共现 Top 20（黄金搭档）</h2>
            <div id="cooccurrence-table"></div>
        </div>
    </div>

    <div class="tab-content" id="trend">
        <div class="card">
            <h2>号码走势（输入号码 1-35）</h2>
            <input type="number" id="trend-number" min="1" max="35" value="7" style="padding: 8px; border-radius: 4px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; margin-bottom: 10px;">
            <div id="trend-chart" class="chart"></div>
        </div>
    </div>

    <div class="footer">
        💡 数据基于大乐透历史开奖记录 · 算法可配置 · 仅供研究参考
        <br>
        <button class="refresh" onclick="refreshData()" style="margin-top: 10px;">🔄 刷新缓存</button>
        <span id="feed-status" style="margin-left: 20px; color: #64748b;">● 推送未连接</span>
    </div>

    <!-- 新开奖通知弹窗 -->
    <div id="notify-toast" style="
        position: fixed; top: 20px; right: 20px;
        background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
        color: white; padding: 20px 28px;
        border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        display: none; z-index: 9999; max-width: 380px;
        animation: slideIn 0.4s ease-out;
    ">
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 8px;" id="notify-title"></div>
        <div style="font-size: 14px; opacity: 0.9;" id="notify-body"></div>
        <button onclick="document.getElementById('notify-toast').style.display='none'"
                style="position: absolute; top: 8px; right: 12px; background: transparent;
                       border: none; color: white; font-size: 20px; cursor: pointer;">×</button>
    </div>
    <style>
        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>

    <script>
        // 切换 Tab
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        async function fetchJSON(url) {
            const resp = await fetch(url);
            return resp.json();
        }

        function getColor(score) {
            if (score >= 0.75) return '#dc2626';
            if (score >= 0.45) return '#fbbf24';
            return '#1e3a8a';
        }

        async function renderOverview() {
            const [front, back] = await Promise.all([
                fetchJSON('/api/heatmap/front'),
                fetchJSON('/api/heatmap/back'),
            ]);

            // 前区热度条形图
            const frontTrace = {
                x: front.numbers,
                y: front.composite,
                type: 'bar',
                marker: { color: front.composite.map(getColor) },
                hovertemplate: '号码 %{x}<br>热度: %{y:.3f}<extra></extra>',
            };
            Plotly.newPlot('front-bar', [frontTrace], {
                title: '前区 1-35 热度分布',
                template: 'plotly_dark',
                xaxis: { title: '号码' },
                yaxis: { title: '热度', range: [0, 1] },
                height: 400,
            }, { displayModeBar: false });

            // 后区热度条形图
            const backTrace = {
                x: back.numbers,
                y: back.composite,
                type: 'bar',
                marker: { color: back.composite.map(getColor) },
                hovertemplate: '号码 %{x}<br>热度: %{y:.3f}<extra></extra>',
            };
            Plotly.newPlot('back-bar', [backTrace], {
                title: '后区 1-12 热度分布',
                template: 'plotly_dark',
                xaxis: { title: '号码' },
                yaxis: { title: '热度', range: [0, 1] },
                height: 400,
            }, { displayModeBar: false });

            // 冷热分区
            const [frontHC, backHC] = await Promise.all([
                fetchJSON('/api/hot-cold/front'),
                fetchJSON('/api/hot-cold/back'),
            ]);
            renderHotCold('hot-cold-overview', frontHC, backHC);

            // 统计
            document.getElementById('stats').innerHTML = `
                <div class="stat"><div class="stat-value">${front.hot?.length || 0}</div><div class="stat-label">前区热号</div></div>
                <div class="stat"><div class="stat-value">${back.hot?.length || 0}</div><div class="stat-label">后区热号</div></div>
                <div class="stat"><div class="stat-value">${front.cold?.length || 0}</div><div class="stat-label">前区冷号</div></div>
                <div class="stat"><div class="stat-value">${back.cold?.length || 0}</div><div class="stat-label">后区冷号</div></div>
            `;
        }

        async function renderFrontDetail() {
            const data = await fetchJSON('/api/heatmap/front');
            const algos = Object.keys(data.algorithms);

            const traces = algos.map(algo => ({
                x: data.numbers,
                y: data.algorithms[algo],
                type: 'scatter',
                mode: 'lines+markers',
                name: algo,
            }));

            Plotly.newPlot('front-detail', traces, {
                title: '前区 - 各算法热度对比',
                template: 'plotly_dark',
                xaxis: { title: '号码' },
                yaxis: { title: '热度', range: [0, 1] },
                height: 500,
                hovermode: 'x unified',
            }, { displayModeBar: false });

            const hc = await fetchJSON('/api/hot-cold/front');
            renderHotCold('front-hotcold', hc, null, 'front');
        }

        async function renderBackDetail() {
            const data = await fetchJSON('/api/heatmap/back');
            const algos = Object.keys(data.algorithms);

            const traces = algos.map(algo => ({
                x: data.numbers,
                y: data.algorithms[algo],
                type: 'scatter',
                mode: 'lines+markers',
                name: algo,
            }));

            Plotly.newPlot('back-detail', traces, {
                title: '后区 - 各算法热度对比',
                template: 'plotly_dark',
                xaxis: { title: '号码' },
                yaxis: { title: '热度', range: [0, 1] },
                height: 500,
                hovermode: 'x unified',
            }, { displayModeBar: false });

            const hc = await fetchJSON('/api/hot-cold/back');
            renderHotCold('back-hotcold', null, hc, 'back');
        }

        async function renderCooccurrence() {
            const data = await fetchJSON('/api/co-occurrence/front?top_k=20');
            const rows = data.pairs.map(p => `
                <tr style="border-bottom: 1px solid #334155;">
                    <td style="padding: 8px;"><span class="number-pill" style="background: #dc2626;">${String(p.num_a).padStart(2, '0')}</span>
                     + <span class="number-pill" style="background: #dc2626;">${String(p.num_b).padStart(2, '0')}</span></td>
                    <td style="padding: 8px; text-align: center;">${p.cooccurrence}</td>
                    <td style="padding: 8px; text-align: center;">${(p.conditional_prob * 100).toFixed(1)}%</td>
                </tr>
            `).join('');

            document.getElementById('cooccurrence-table').innerHTML = `
                <table style="width: 100%; border-collapse: collapse;">
                    <thead style="background: #0f172a;">
                        <tr>
                            <th style="padding: 12px; text-align: left;">号码对</th>
                            <th style="padding: 12px;">共现次数</th>
                            <th style="padding: 12px;">条件概率</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        async function renderTrend() {
            const number = parseInt(document.getElementById('trend-number').value) || 7;
            const data = await fetchJSON(`/api/trend/front?number=${number}`);
            Plotly.newPlot('trend-chart', [{
                y: data.rolling_freq,
                type: 'scatter',
                mode: 'lines',
                fill: 'tozeroy',
                line: { color: '#fbbf24', width: 2 },
            }], {
                title: `号码 ${number} - 滚动频率（窗口=30期）<br>动量: ${data.momentum.momentum} (${data.momentum.trend}) · 状态: ${data.status}`,
                template: 'plotly_dark',
                xaxis: { title: '期数（最新在右）', autorange: 'reversed' },
                yaxis: { title: '频率' },
                height: 450,
            }, { displayModeBar: false });
        }

        function renderHotCold(elementId, frontHC, backHC, singleZone) {
            const renderZone = (label, hc, type) => {
                if (!hc) return '';
                return `<div class="heat-section ${type}">
                    <h3>${label} - 热号 (${hc.hot.length})</h3>
                    <div>${hc.hot.map(n => `<span class="number-pill">${String(n).padStart(2, '0')}</span>`).join('')}</div>
                    <h3 style="margin-top: 12px;">${label} - 温号 (${hc.warm.length})</h3>
                    <div>${hc.warm.slice(0, 12).map(n => `<span class="number-pill">${String(n).padStart(2, '0')}</span>`).join('')}</div>
                    <h3 style="margin-top: 12px;">${label} - 冷号 (${hc.cold.length})</h3>
                    <div>${hc.cold.slice(0, 12).map(n => `<span class="number-pill">${String(n).padStart(2, '0')}</span>`).join('')}</div>
                </div>`;
            };

            let html = '<div class="hot-cold-grid">';
            if (frontHC) html += renderZone('前区', frontHC, 'hot');
            if (backHC) html += renderZone('后区', backHC, 'warm');
            if (singleZone === 'front' && frontHC) html = '<div class="hot-cold-grid">' + renderZone('前区', frontHC, 'hot') + '</div>';
            if (singleZone === 'back' && backHC) html = '<div class="hot-cold-grid">' + renderZone('后区', backHC, 'warm') + '</div>';
            html += '</div>';
            document.getElementById(elementId).innerHTML = html;
        }

        async function refreshData() {
            await fetch('/api/refresh', { method: 'POST' });
            location.reload();
        }

        // SSE 实时推送
        function connectFeed() {
            const es = new EventSource('/api/feed');
            const status = document.getElementById('feed-status');

            es.addEventListener('connected', (e) => {
                const d = JSON.parse(e.data);
                status.textContent = `● 推送已连接 (${d.subscribers} 订阅)`;
                status.style.color = '#10b981';
            });

            es.addEventListener('new_draw', (e) => {
                const d = JSON.parse(e.data);
                showNotification(d);
                // 自动刷新仪表盘数据
                setTimeout(() => location.reload(), 3000);
            });

            es.addEventListener('heartbeat', () => {
                // 心跳无需处理
            });

            es.onerror = () => {
                status.textContent = '● 推送断开，重连中...';
                status.style.color = '#dc2626';
                setTimeout(connectFeed, 5000);
            };
        }

        function showNotification(d) {
            const front = d.front.map(n => String(n).padStart(2, '0')).join(' ');
            const back = d.back.map(n => String(n).padStart(2, '0')).join(' ');
            document.getElementById('notify-title').textContent = `🎯 新开奖！第 ${d.period} 期`;
            document.getElementById('notify-body').innerHTML =
                `日期: ${d.draw_date}<br>前区: <b style="font-size:18px;">${front}</b><br>后区: <b style="font-size:18px;">${back}</b>`;
            const toast = document.getElementById('notify-toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 8000);
        }

        // 启动 SSE 连接
        connectFeed();

        // 初始化
        renderOverview();
        renderFrontDetail();
        renderBackDetail();
        renderCooccurrence();

        document.getElementById('trend-number').addEventListener('change', renderTrend);
        renderTrend();

        // 趋势 tab 点击时刷新
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                if (tab.dataset.tab === 'trend') renderTrend();
            });
        });
    </script>
</body>
</html>
